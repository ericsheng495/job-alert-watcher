<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 Job Tracker</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f5f5f5;color:#111827}

    header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 32px;display:flex;align-items:center;gap:12px}
    header h1{font-size:16px;font-weight:700}
    .sub{font-size:13px;color:#6b7280}
    .updated{margin-left:auto;font-size:12px;color:#9ca3af}

    .co-strip{background:#fff;border-bottom:1px solid #e5e7eb;padding:20px 32px 24px}
    .co-label{font-size:11px;font-weight:600;color:#9ca3af;letter-spacing:.07em;text-transform:uppercase;margin-bottom:16px}
    .co-grid{display:flex;gap:14px;flex-wrap:wrap}
    .co-tile{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px}
    .co-tile-top{position:relative}
    .co-logo{width:44px;height:44px;border-radius:10px;border:1px solid #e5e7eb;object-fit:contain;background:#fff;display:block}
    .co-badge{position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;border-radius:999px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #f5f5f5}
    .co-name{font-size:10px;color:#6b7280;text-align:center;line-height:1.3}

    .toolbar{padding:12px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e5e7eb;background:#fff}
    .chip{padding:5px 12px;border-radius:999px;border:1px solid #d1d5db;background:#fff;font-size:12px;color:#374151;cursor:pointer;transition:all .12s}
    .chip:hover{border-color:#111827}
    .chip.active{background:#111827;color:#fff;border-color:#111827}
    input[type=search]{margin-left:auto;padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;outline:none;width:200px}
    input[type=search]:focus{border-color:#111827}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:20px 32px 48px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
    .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
    .card.hidden{display:none}
    .card-header{display:flex;align-items:center;gap:8px}
    .logo{width:18px;height:18px;border-radius:3px;object-fit:contain}
    .company-name{font-size:11px;font-weight:600;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;flex:1}
    .date{font-size:11px;color:#d1d5db}
    .title{font-size:14px;font-weight:600;color:#111827;line-height:1.4}
    .location{font-size:12px;color:#9ca3af}
    .apply-btn{margin-top:4px;display:inline-block;padding:6px 14px;background:#111827;color:#fff;border-radius:5px;font-size:12px;font-weight:500;text-decoration:none;align-self:flex-start}
    .apply-btn:hover{background:#1f2937}
    #empty{display:none;padding:48px 32px;text-align:center;color:#9ca3af;font-size:14px}
  </style>
</head>
<body>
  <header>
    <h1>2027 Job Tracker</h1>
    <span class="sub">New Grad &amp; Intern &nbsp;·&nbsp; <span id="count">0 postings</span></span>
    <span class="updated">Updated Aug 14, 2026 at 22:37 UTC</span>
  </header>

  <div class="co-strip">
    <div class="co-label">Watching 10 companies</div>
    <div class="co-grid"><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/stripe.com" onerror="this.style.display='none'" alt="Stripe" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">Stripe</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/databricks.com" onerror="this.style.display='none'" alt="Databricks" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">Databricks</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/anduril.com" onerror="this.style.display='none'" alt="Anduril" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">Anduril</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/datadoghq.com" onerror="this.style.display='none'" alt="Datadog" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">Datadog</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/pinterest.com" onerror="this.style.display='none'" alt="Pinterest" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">Pinterest</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/mongodb.com" onerror="this.style.display='none'" alt="MongoDB" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">MongoDB</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/ramp.com" onerror="this.style.display='none'" alt="Ramp" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">Ramp</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/snap.com" onerror="this.style.display='none'" alt="Snap" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">Snap</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/nvidia.com" onerror="this.style.display='none'" alt="NVIDIA" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">NVIDIA</div></div><div class="co-tile"><div class="co-tile-top"><img src="https://logo.clearbit.com/google.com" onerror="this.style.display='none'" alt="Google" class="co-logo"><span class="co-badge" style="background:#e5e7eb;color:#9ca3af;">0</span></div><div class="co-name">Google</div></div></div>
  </div>

  <div class="toolbar">
    <button onclick="filter('')" class="chip active" id="chip-all">All</button> 
    <input type="search" id="search" placeholder="Search roles..." oninput="applyFilters()">
  </div>

  <div class="grid" id="grid"></div>
  <div id="empty">No matching postings found.</div>

  <script>
    let active = '';
    function filter(c) {
      active = c;
      document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
      document.getElementById('chip-' + (c || 'all')).classList.add('active');
      applyFilters();
    }
    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase();
      let n = 0;
      document.querySelectorAll('.card').forEach(card => {
        const ok = (!active || card.dataset.company === active) && (!q || card.textContent.toLowerCase().includes(q));
        card.classList.toggle('hidden', !ok);
        if (ok) n++;
      });
      document.getElementById('count').textContent = n + ' postings';
      document.getElementById('empty').style.display = n ? 'none' : 'block';
    }
  </script>
</body>
</html>
