    type: greenhouse
    token: stripe

  - name: Databricks
    type: greenhouse
    token: databricks

  - name: Anduril
    type: greenhouse
    token: andurilindustries

  - name: Datadog
    type: greenhouse
    token: datadog

  - name: Pinterest
    type: greenhouse
    token: pinterest

  - name: MongoDB
    type: greenhouse
    token: mongodb

  - name: Ramp
    type: ashby
    token: ramp

  - name: Snap
    type: workday
