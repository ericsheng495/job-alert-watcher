# Title filters (case-insensitive regex).
# A job matches if it hits at least one "include" and no "exclude".
filters:
  include:
    - "new.?grad"
    - "university.?grad"
    - "early.?career"
    - "entry.?level"
    - "2027"
  exclude:
    - "senior"
    - "staff"
    - "principal"
    - "manager"
    - "phd"
    - "lead"
    - "2025"
    - "2026"
    - "2028"
    - "2029"
    # non-SWE roles
    - "electrical"
    - "mechanical"
    - "manufacturing"
    - "hardware"
    - "product manage"
    - "program manager"
    - "data scientist"
    - "data analyst"
    - "finance"
    - "accounting"
    - "marketing"
    - "recruiter"
    - "customer support"
    - "support representative"
    - "sales"
    - "legal"
    - "operations"
    - "designer"
    - "ux"

  # US-only: job must match at least one pattern (empty location passes through).
  location_include:
    - "united states"
    - "\\busa?\\b"
    - "remote"
    # US state abbreviation after a comma: ", CA" / ", NY" etc.
    - ",\\s*(al|ak|az|ar|ca|co|ct|de|fl|ga|hi|id|il|in|ia|ks|ky|la|me|md|ma|mi|mn|ms|mo|mt|ne|nv|nh|nj|nm|ny|nc|nd|oh|ok|or|pa|ri|sc|sd|tn|tx|ut|vt|va|wa|wv|wi|wy|dc)\\b"
    # Common US cities (no state needed to identify them)
    - "new york|san francisco|seattle|austin|boston|chicago|los angeles|denver|atlanta|portland|dallas|san jose|san diego|menlo park|mountain view|palo alto|bellevue|redmond"

dashboard_url: "https://ericsheng495.github.io/job-alert-watcher/"

