name: job-watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email (yes/no)"
        required: false
        default: "no"
      backfill:
        description: "Backfill jobs.json from current postings (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scan on a 10-minute loop
        env:
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          git config user.name "job-watch-bot"
          git config user.email "actions@users.noreply.github.com"

          ARGS=""
          [ "${{ github.event.inputs.test }}" = "yes" ] && ARGS="$ARGS --test"
          [ "${{ github.event.inputs.backfill }}" = "yes" ] && ARGS="$ARGS --backfill"

          # GitHub throttles scheduled workflows hard: a */10 cron actually
          # fires every ~3h. So each run stays alive and scans on its own
          # 10-minute timer, which is what really sets alert latency.
          SCANS=${LOOP_SCANS:-6}
          for i in $(seq 1 "$SCANS"); do
            echo "--- scan $i/$SCANS ($(date -u +%H:%M:%SZ)) ---"
            python watch.py $ARGS || echo "[warn] scan $i failed, continuing"

            git add seen.json jobs.json index.html
            if ! git diff --cached --quiet; then
              git commit -m "update job board"
              git pull --rebase --autostash -q || true
              git push -q || echo "[warn] push failed, retrying next scan"
            fi

            ARGS=""            # --test/--backfill only apply to the first scan

            # Must be an if, not `[ ... ] && sleep`: on the final pass the test
            # is false, and as the step's last command that would exit 1.
            if [ "$i" -lt "$SCANS" ]; then
              sleep 600
            fi
          done

          echo "loop finished: $SCANS scans"
