name: job-watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email (yes/no)"
        required: false
        default: "no"
      backfill:
        description: "Backfill jobs.json from current postings (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.test }}" = "yes" ] && ARGS="$ARGS --test"
          [ "${{ github.event.inputs.backfill }}" = "yes" ] && ARGS="$ARGS --backfill"
          python watch.py $ARGS

      - name: Persist state and dashboard
        run: |
          git config user.name "job-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json jobs.json index.html
          git diff --cached --quiet || git commit -m "update job board"
          git push
